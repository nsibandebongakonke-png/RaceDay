name: RaceDay CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    name: Build API + MVC (and run tests if present)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore RaceDay.slnx

      - name: Build (API + MVC)
        run: dotnet build RaceDay.slnx --configuration Release --no-restore

      - name: Test
        if: ${{ hashFiles('**/*Test*.csproj') != '' }}
        run: dotnet test RaceDay.slnx --configuration Release --no-build --verbosity normal

  docker:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build MVC image
        run: docker build -t raceday-web ./RaceDay.Web
      - name: Build API image
        run: docker build -t raceday-api ./RaceDay.Api
